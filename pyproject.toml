[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "webbreach"
version = "1.0.0"
description = "Web application exploitation framework — OWASP Top-10 engines, built-in localhost vuln targets, AI-guided scan queue"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "5h4d0wn1k"}]
keywords = ["security", "pentesting", "owasp", "webapp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
]

[project.scripts]
webbreach = "webbreach.cli:main"

[project.entry-points.console_scripts]
webbreach = "webbreach.cli:main"

[tool.setuptools.packages.find]
include = ["webbreach*"]
